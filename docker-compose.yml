services:
  snowball:
    build: .
    container_name: snowball
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: paper
      LIVE_ENABLED: "false"
      HALT_FILE: /app/data/HALT
      SQLITE_PATH: /app/data/snowball.db
      HEARTBEAT_PATH: /app/data/heartbeat
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - snowball-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  snowball-data:
